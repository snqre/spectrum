[package]
name = "reliq"
version = "0.5.1"
edition = "2024"
description = "Fixed-point data type collection"
license = "MIT OR Apache-2.0"

[dependencies]
derive_more = ">=1.0.0,<2.0.0"
num-traits = ">=0.2.19,<1.0.0"
duplicate = ">=2.0.0,<3.0.0"
thiserror = ">=2.0.0,<3.0.0"
ethnum = ">=1.5.0,<2.0.0"
constime = ">=0.1.0,<1.0.0"
rstest = ">=0.1.0,<1.0.0"
modwire = ">=0.1.0,<1.0.0"

[dev-dependencies]
criterion = ">=0.1.0,<1.0.0"

[[bench]]
name = "benchmark"
harness = false

[features]

default = [
	"std",
	"num-traits/std",
	"derive_more/deref",
	"derive_more/deref_mut",
	"derive_more/add",
	"derive_more/add_assign",
	"derive_more/mul",
	"derive_more/mul_assign",
	"derive_more/try_from",
	"derive_more/try_into",
	"derive_more/from",
	"derive_more/into",
	"derive_more/as_ref",
	"derive_more/display"
]

std = []
